<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧上肢復健雲端監控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 基礎設定 */
        .btn-export {
            background-color: #27AE60; color: white; border: none; border-radius: 5px;
            padding: 8px 15px; cursor: pointer; font-size: 14px; font-weight: bold;
            margin-left: 15px;}
        .btn-export:hover { background-color: #229954; }
        .modal-header { display: flex; align-items: center; margin-bottom: 15px; }
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background-color: #F4F7F6;
            margin: 0;
            padding: 20px;
            color: #2C3E50;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 1. 頂部標題與時鐘 */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 22pt; margin: 0; color: #2C3E50; }
        .clock { font-size: 14pt; font-weight: bold; color: #7F8C8D; }

        /* 2. 病歷區 */
        .info-group {
            background-color: white; border: 2px solid #D5D8DC; border-radius: 10px;
            padding: 20px 15px 15px 15px; position: relative; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .info-title { position: absolute; top: -12px; left: 15px; background-color: white; padding: 0 5px; font-weight: bold; font-size: 12pt; }
        .info-group label { font-weight: bold; }
        .info-group input { border: 1px solid #BDC3C7; border-radius: 5px; padding: 8px; font-size: 14px; outline: none; }
        .btn-red { background-color: #E74C3C; color: white; border: none; border-radius: 5px; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-left: auto; }

        /* 3. 數據卡片區 */
        .data-layout { display: flex; gap: 15px; margin-bottom: 20px; }
        .data-card { flex: 1; border-radius: 10px; padding: 20px; text-align: center; }
        .card-title { font-size: 12pt; font-weight: bold; margin-bottom: 10px; }
        .card-value { font-size: 30pt; font-weight: bold; white-space: pre-line; }
        #hr-card { background-color: #FDEDEC; border: 1px solid #E74C3C; color: #E74C3C; }
        #spo2-card { background-color: #EBF5FB; border: 1px solid #3498DB; color: #3498DB; }
        #rpm-card { background-color: #FEF5E7; border: 1px solid #E67E22; color: #E67E22; }
        #hr-card.alert { background-color: #E74C3C !important; color: white !important; }

        /* 4. 圖表區 */
        .chart-group { background-color: white; border: 1px solid #D5D8DC; border-radius: 10px; padding: 15px; margin-bottom: 20px; }

        /* 5. 歷史紀錄表格區 */
        .history-group { background-color: white; border: 1px solid #D5D8DC; border-radius: 10px; padding: 15px; }
        .history-group h3 { margin-top: 0; color: #2C3E50; border-bottom: 2px solid #3498DB; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #ECF0F1; }
        th { background-color: #F8F9F9; font-weight: bold; color: #7F8C8D; }
        tr:hover { background-color: #F4F6F7; }
        .badge { padding: 5px 10px; border-radius: 15px; color: white; font-size: 12px; font-weight: bold; }
        .btn-view { background-color: #3498DB; color: white; border: none; border-radius: 5px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
        .btn-view:hover { background-color: #2980B9; }

        /* 6. 彈出視窗設定 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 800px;
            position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .close-btn {
            position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer;
            background: none; border: none; color: #7F8C8D;
        }
        .close-btn:hover { color: #2C3E50; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>智慧上肢復健 - 雲端監控中心</h1>
        <div class="clock" id="clock">YYYY-MM-DD HH:MM:SS</div>
    </div>

    <div class="info-group">
        <div class="info-title">即時生理與設備監控</div>
        <label>病歷號：</label><input type="text" value="A12345678" disabled style="width: 100px;">
        <label>姓名：</label><input type="text" value="測試病患" disabled style="width: 80px;">
        
        <div style="margin-left: auto; display: flex; gap: 10px; align-items: center; border-left: 2px solid #ECF0F1; padding-left: 15px;">
            <span style="font-weight: bold; color: #E74C3C;">醫師遠距處方：</span>
            <button onclick="sendRemoteCommand('自動模式', 1)" style="background-color: #27AE60; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;">啟動(1檔)</button>
            <button onclick="sendRemoteCommand('阻力模式', 3)" style="background-color: #E67E22; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;">阻力加強(3檔)</button>
            <button onclick="sendRemoteCommand('停止', 0)" style="background-color: #E74C3C; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer;">緊急停止</button>
        </div>
    </div>

    <div class="data-layout">
        <div class="data-card" id="hr-card"><div class="card-title">即時心率 (BPM)</div><div class="card-value" id="hr-val">--</div></div>
        <div class="data-card" id="spo2-card"><div class="card-title">血氧濃度 (%)</div><div class="card-value" id="spo2-val">--</div></div>
        <div class="data-card" id="rpm-card"><div class="card-title">馬達轉速 (RPM)</div><div class="card-value" id="rpm-val">--</div></div>
    </div>

    <div class="chart-group">
        <canvas id="hrChart" height="80"></canvas>
    </div>

    <div class="history-group">
        <h3>歷史復健療程紀錄</h3>
        <table>
            <thead>
                <tr>
                    <th>療程時間</th>
                    <th>訓練模式</th>
                    <th>總時長</th>
                    <th>總圈數</th>
                    <th>平均轉速</th>
                    <th>心率 / 血氧</th>
                    <th>深度分析</th>
                </tr>
            </thead>
            <tbody id="history-tbody">
                <tr><td colspan="7" style="text-align: center;">載入資料中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="chartModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeChartModal()">✖</button>
        <div class="modal-header">
            <h3 id="modal-title" style="margin-top: 0; margin-bottom: 0; color: #2C3E50;">療程詳細分析</h3>
            <button class="btn-export" onclick="exportCSV()">匯出 CSV 原始檔</button>
        </div>
        <canvas id="detailChart" height="120"></canvas>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://dsp-rehab-iot-default-rtdb.firebaseio.com" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 全域變數供彈出視窗使用
    window.historyCache = {};
    let detailChartInstance = null;

    // --- 1. 時鐘 ---
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleString('zh-TW', { hour12: false });
    }
    setInterval(updateClock, 1000); updateClock();

    // --- 2. 即時圖表 ---
    const ctx = document.getElementById('hrChart').getContext('2d');
    const hrHistory = Array(50).fill(0);
    const hrChart = new Chart(ctx, {
        type: 'line',
        data: { labels: Array(50).fill(''), datasets: [{ label: '即時心率', data: hrHistory, borderColor: '#E74C3C', borderWidth: 3, fill: false, tension: 0, pointRadius: 0 }] },
        options: { responsive: true, animation: false, scales: { y: { min: 50, max: 150 } }, plugins: { legend: { display: false } } }
    });

    // --- 3. 監聽即時數據 ---
    let currentRpm = 0; let currentMode = "未知";
    onValue(ref(db, 'HeartRate'), (s) => {
        const hr = s.val() || 0;
        document.getElementById('hr-val').innerText = hr;
        hr > 130 ? document.getElementById('hr-card').classList.add('alert') : document.getElementById('hr-card').classList.remove('alert');
        hrHistory.push(hr); hrHistory.shift(); hrChart.update();
    });
    onValue(ref(db, 'SpO2'), (s) => document.getElementById('spo2-val').innerText = s.val() || 0);
    onValue(ref(db, 'RPM'), (s) => { currentRpm = s.val() || 0.0; document.getElementById('rpm-val').innerHTML = `${currentRpm}<br><span style="font-size:18pt">(${currentMode})</span>`; });
    onValue(ref(db, 'CurrentMode'), (s) => { currentMode = s.val() || "未知"; document.getElementById('rpm-val').innerHTML = `${currentRpm}<br><span style="font-size:18pt">(${currentMode})</span>`; });

    // --- 4. 抓取歷史紀錄並渲染表格 ---
    function getModeColor(mode) {
        if (!mode) return '#7F8C8D';
        if (mode.includes('自動')) return '#27AE60';
        if (mode.includes('阻力')) return '#E67E22';
        if (mode.includes('自適應')) return '#8E44AD';
        if (mode.includes('助力')) return '#F321DE';
        return '#7F8C8D';
    }

    onValue(ref(db, 'History'), (snapshot) => {
        const historyData = snapshot.val();
        const tbody = document.getElementById('history-tbody');
        tbody.innerHTML = '';
        window.historyCache = {}; 

        if (historyData) {
            const records = Object.keys(historyData).map(key => ({
                id: key, ...historyData[key]
            })).sort((a, b) => new Date(b.time) - new Date(a.time));

            records.forEach(record => {
                window.historyCache[record.id] = record; // 存入暫存供圖表讀取
                
                const tr = document.createElement('tr');
                const dateObj = new Date(record.time);
                const dateStr = dateObj.toLocaleString('zh-TW', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                const modeColor = getModeColor(record.mode);
                const modeBadge = `<span class="badge" style="background-color: ${modeColor}">${record.mode || '未知'}</span>`;

                tr.innerHTML = `
                    <td>${dateObj.getFullYear()}-${dateStr}</td>
                    <td>${modeBadge}</td>
                    <td><b>${record.duration || '00:00'}</b></td>
                    <td>${record.totalLaps || 0} 圈</td>
                    <td>${record.avgRpm || 0} RPM</td>
                    <td>${record.finalHeartRate || 0} / ${record.finalSpO2 || 0}%</td>
                    <td><button class="btn-view" onclick="openChartModal('${record.id}')">查看圖表</button></td>
                `;
                tbody.appendChild(tr);
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #7F8C8D;">目前沒有任何歷史復健紀錄</td></tr>';
        }
    });

    // --- 5. 處理圖表彈出視窗 ---
    window.openChartModal = function(id) {
        window.currentRecordId = id;
        const record = window.historyCache[id];
        if (!record || !record.dataLog) {
            alert("此筆紀錄缺乏詳細的過程數據");
            return;
        }

        document.getElementById('chartModal').style.display = 'flex';
        const dateObj = new Date(record.time);
        document.getElementById('modal-title').innerText = `療程詳細分析 - ${dateObj.toLocaleString('zh-TW', { hour12: false })}`;

        // 解析 dataLog
        const dataLog = Array.isArray(record.dataLog) ? record.dataLog : Object.values(record.dataLog);
        const labels = [];
        const rpmData = [];
        const hrData = [];

        dataLog.forEach(log => {
            if (log.timestamp) {
                const t = new Date(log.timestamp);
                labels.push(`${String(t.getMinutes()).padStart(2, '0')}:${String(t.getSeconds()).padStart(2, '0')}`);
                rpmData.push(Number(log.rpm) || 0);
                hrData.push(Number(log.hr) || 0);
            }
        });

        // 繪製雙軸圖表
        const chartCtx = document.getElementById('detailChart').getContext('2d');
        if (detailChartInstance) detailChartInstance.destroy(); // 清除舊圖表

        detailChartInstance = new Chart(chartCtx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '轉速 (RPM)', data: rpmData,
                        borderColor: '#3498DB', backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        yAxisID: 'y', tension: 0.2, borderWidth: 2, pointRadius: 2, fill: true
                    },
                    {
                        label: '心率 (BPM)', data: hrData,
                        borderColor: '#E74C3C', backgroundColor: 'transparent',
                        yAxisID: 'y1', tension: 0.2, borderWidth: 2, pointRadius: 2
                    }
                ]
            },
            options: {
                responsive: true,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    y: { type: 'linear', display: true, position: 'left', title: { display: true, text: '轉速 (RPM)' } },
                    y1: { type: 'linear', display: true, position: 'right', title: { display: true, text: '心率 (BPM)' }, grid: { drawOnChartArea: false } }
                }
            }
        });
    };

    window.exportCSV = function() {
    const record = window.historyCache[window.currentRecordId];
    if (!record || !record.dataLog) {
        alert("無效的紀錄或缺乏詳細數據");
        return;
    }

    // 建立 CSV 標題列
    let csvContent = "時間戳記,訓練模式,檔位,轉速(RPM),心率(BPM),血氧(%)\n";
    
    // 解析資料並寫入每一列
    const dataLog = Array.isArray(record.dataLog) ? record.dataLog : Object.values(record.dataLog);
    dataLog.forEach(log => {
        const time = log.timestamp ? new Date(log.timestamp).toLocaleTimeString('zh-TW', {hour12: false}) : "未知時間";
        const mode = log.mode || "未知";
        const gear = log.gear || 1;
        const rpm = log.rpm || 0;
        const hr = log.hr || 0;
        const spo2 = log.spo2 || 0;
        
        csvContent += `${time},${mode},${gear},${rpm},${hr},${spo2}\n`;
    });

    // 加上 BOM 標記，避免 Excel 打開中文變亂碼
    const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
    const blob = new Blob([bom, csvContent], { type: "text/csv;charset=utf-8;" });
    
    // 建立隱藏的下載連結並觸發
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    const dateObj = new Date(record.time);
    const fileName = `復健紀錄_${dateObj.getFullYear()}${(dateObj.getMonth()+1).toString().padStart(2,'0')}${dateObj.getDate().toString().padStart(2,'0')}.csv`;
    
    link.setAttribute("href", url);
    link.setAttribute("download", fileName);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};
    window.closeChartModal = function() {
        document.getElementById('chartModal').style.display = 'none';
    };
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    window.sendRemoteCommand = function(mode, gear) {
        if(confirm(`確定要對機台下達遠端指令嗎？\n模式：${mode}\n檔位：${gear}`)) {
            const commandRef = ref(db, 'RemoteCommand');
            // 寫入 Firebase
            set(commandRef, {
                mode: mode,
                gear: gear,
                timestamp: new Date().toISOString()
            }).then(() => {
                alert('遠端指令已發送！');
            }).catch((error) => {
                alert('發送失敗：' + error);
            });
        }
    };
</script>
</body>
</html>
